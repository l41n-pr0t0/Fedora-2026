# Ported from NixOS services.displayManager.sddm
[General]
# layer-shell: greeter surface on Wayland; XHR file read: lets the theme read battery/network from /sys and /proc
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QML_XHR_ALLOW_FILE_READ=1

[Theme]
Current=nier-automata
CursorTheme=catppuccin-frappe-pink-cursors

[Wayland]
SessionDir=/usr/share/wayland-sessions
